# Registration template. Run `shopify app config link`, replace the placeholders,
# configure the deployment secrets, then `shopify app deploy` to register a version.
# This file alone does not create a Shopify app or publish a public listing.
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
name = "StudioShelf"
application_url = "https://REPLACE_WITH_STABLE_APP_DOMAIN/shopify"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_products"
optional_scopes = ["write_products"]
use_legacy_install_flow = false

[auth]
# Managed installation and token exchange do not use an authorization-code callback.
redirect_urls = ["https://REPLACE_WITH_STABLE_APP_DOMAIN/shopify"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update", "products/update"]
uri = "/api/shopify/webhooks"
